<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSFS Flight Deck - Command Center</title>
    <style>
        /* --- ESTILOS BASE Y VARIABLES --- */
        :root {
            --bg-dark: #060913;
            --panel-bg: rgba(15, 23, 42, 0.75);
            --panel-border: rgba(56, 189, 248, 0.2);
            --accent-cyan: #00f2fe;
            --accent-blue: #4facfe;
            --text-main: #f1f5f9;
            --text-muted: #64748b;
            --glow-shadow: 0 0 25px rgba(0, 242, 254, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: radial-gradient(circle at 50% 0%, #111827 0%, #060913 100%);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- BARRA SUPERIOR (HUD HEADER) --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: rgba(10, 15, 30, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--panel-border);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            z-index: 100;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-badge {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
            color: #060913;
            font-weight: 900;
            font-size: 0.85rem;
            padding: 6px 10px;
            border-radius: 6px;
            letter-spacing: 1.5px;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
        }

        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .breadcrumb span.active {
            color: var(--accent-cyan);
            font-weight: 700;
        }

        .search-wrapper {
            position: relative;
        }

        .search-wrapper input {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid var(--panel-border);
            color: #fff;
            padding: 10px 16px 10px 40px;
            border-radius: 20px;
            font-size: 0.85rem;
            outline: none;
            width: 220px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .search-wrapper input:focus {
            width: 280px;
            border-color: var(--accent-cyan);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.25);
            background: rgba(30, 41, 59, 0.9);
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* --- CONTENEDOR PRINCIPAL --- */
        .viewport {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        /* --- DASHBOARD (GRID DE CARPETAS) --- */
        .dashboard-grid {
            position: absolute;
            inset: 0;
            padding: 40px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            overflow-y: auto;
            opacity: 1;
            transition: opacity 0.4s ease, transform 0.4s ease;
            z-index: 10;
        }

        .dashboard-grid.hidden {
            opacity: 0;
            transform: scale(0.95);
            pointer-events: none;
        }

        .cyber-card {
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            padding: 28px 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .cyber-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.05), transparent);
            transition: left 0.6s ease;
        }

        .cyber-card:hover {
            transform: translateY(-8px);
            border-color: var(--accent-cyan);
            box-shadow: var(--glow-shadow);
        }

        .cyber-card:hover::after {
            left: 100%;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
        }

        .card-icon {
            font-size: 2.5rem;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 4px 8px rgba(0, 242, 254, 0.3));
        }

        .card-badge {
            font-size: 0.7rem;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 12px;
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent-cyan);
            border: 1px solid rgba(56, 189, 248, 0.2);
            text-transform: uppercase;
        }

        .card-title {
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            color: #fff;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 15px;
            margin-top: 15px;
        }

        .card-action {
            color: var(--accent-cyan);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* --- VISTA DE DETALLE (SIDEBAR + WORKSPACE) --- */
        .workspace {
            position: absolute;
            inset: 0;
            display: flex;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.4s ease, transform 0.4s ease;
            pointer-events: none;
            z-index: 5;
        }

        .workspace.active {
            opacity: 1;
            transform: translateY(0);
            pointer-events: all;
        }

        /* --- SIDEBAR LATERAL --- */
        sidebar {
            width: 320px;
            background: rgba(10, 15, 30, 0.8);
            backdrop-filter: blur(12px);
            border-right: 1px solid var(--panel-border);
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .sidebar-nav-back {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
            transition: all 0.2s ease;
        }

        .sidebar-nav-back:hover {
            background: var(--accent-cyan);
            color: #060913;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
        }

        .sidebar-category-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            margin-bottom: 12px;
            font-weight: 700;
        }

        .file-tree {
            list-style: none;
            overflow-y: auto;
            flex: 1;
        }

        .file-item {
            padding: 12px 14px;
            margin-bottom: 6px;
            border-radius: 8px;
            background: rgba(30, 41, 59, 0.3);
            border: 1px solid transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
            color: #cbd5e1;
            transition: all 0.2s ease;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .file-item:hover {
            background: rgba(30, 41, 59, 0.7);
            border-color: rgba(56, 189, 248, 0.3);
            color: #fff;
            transform: translateX(4px);
        }

        .file-item.active {
            background: linear-gradient(90deg, rgba(0, 242, 254, 0.15), transparent);
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
            font-weight: 700;
            box-shadow: -3px 0 0 var(--accent-cyan);
        }

        /* --- VISOR PRINCIPAL --- */
        main {
            flex: 1;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            background: rgba(6, 9, 19, 0.6);
        }

        .display-frame {
            width: 100%;
            height: 100%;
            border-radius: 12px;
            border: 1px solid var(--panel-border);
            display: none;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }

        .image-frame {
            object-fit: contain;
            background: #020408;
        }

        .placeholder-hud {
            text-align: center;
            padding: 40px;
            border: 1px dashed var(--panel-border);
            border-radius: 16px;
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            max-width: 420px;
        }

        .placeholder-icon {
            font-size: 3rem;
            margin-bottom: 15px;
            opacity: 0.6;
        }

        .placeholder-title {
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 8px;
        }

        .placeholder-subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* Responsive */
        @media (max-width: 850px) {
            .workspace {
                flex-direction: column;
            }
            sidebar {
                width: 100%;
                height: 35vh;
                border-right: none;
                border-bottom: 1px solid var(--panel-border);
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-container">
            <div class="logo-badge">MSFS</div>
            <div class="breadcrumb">
                <span>Hangar</span>
                <span id="crumb-sep" style="display: none;">/</span>
                <span id="crumb-folder" style="display: none;">-</span>
                <span id="crumb-file-sep" style="display: none;">/</span>
                <span id="crumb-file" class="active" style="display: none;">-</span>
            </div>
        </div>
        <div class="search-wrapper">
            <span class="search-icon">🔍</span>
            <input type="text" id="global-search" placeholder="Buscar documento...">
        </div>
    </header>

    <div class="viewport">

        <!-- DASHBOARD GRID -->
        <div id="dashboard-grid" class="dashboard-grid">
            <div class="placeholder-hud" style="grid-column: 1/-1; justify-self: center; align-self: center;">
                <div class="placeholder-icon">⚡</div>
                <div class="placeholder-title">Conectando con Sistemas</div>
                <div class="placeholder-subtitle">Accediendo a la API del hangar privado...</div>
            </div>
        </div>

        <!-- WORKSPACE (SIDEBAR + DISPLAY) -->
        <div id="workspace" class="workspace">
            <sidebar>
                <button id="btn-back" class="sidebar-nav-back">
                    <span>←</span> Volver al Hangar
                </button>
                <div class="sidebar-category-title" id="current-folder-title">ARCHIVOS</div>
                <ul class="file-tree" id="file-list"></ul>
            </sidebar>

            <main>
                <div class="placeholder-hud" id="hud-welcome">
                    <div class="placeholder-icon">🛩️</div>
                    <div class="placeholder-title">SISTEMA LISTO</div>
                    <div class="placeholder-subtitle">Selecciona una carta de navegación o documento de la lista lateral.</div>
                </div>

                <iframe class="display-frame" id="pdf-viewer"></iframe>
                <img class="display-frame image-frame" id="img-viewer" alt="Visor de imágenes">
            </main>
        </div>

    </div>

    <script>
        const USERNAME = 'iagohp03';
        const REPO = 'msfs';
        const GITHUB_TOKEN = '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'; // Reemplaza por tu Personal Access Token válido

        // Elementos DOM
        const dashboardGrid = document.getElementById('dashboard-grid');
        const workspace = document.getElementById('workspace');
        const btnBack = document.getElementById('btn-back');
        const fileList = document.getElementById('file-list');
        const currentFolderTitle = document.getElementById('current-folder-title');
        
        const hudWelcome = document.getElementById('hud-welcome');
        const pdfViewer = document.getElementById('pdf-viewer');
        const imgViewer = document.getElementById('img-viewer');
        const globalSearch = document.getElementById('global-search');

        // Breadcrumbs
        const crumbSep = document.getElementById('crumb-sep');
        const crumbFolder = document.getElementById('crumb-folder');
        const crumbFileSep = document.getElementById('crumb-file-sep');
        const crumbFile = document.getElementById('crumb-file');

        let hangarData = {};
        let activeZone = null;

        function getAuthHeader() {
            return GITHUB_TOKEN.startsWith('github_pat_') ? `Bearer ${GITHUB_TOKEN}` : `token ${GITHUB_TOKEN}`;
        }

        async function init() {
            try {
                const res = await fetch(`https://api.github.com/repos/${USERNAME}/${REPO}/contents`, {
                    headers: { 'Authorization': getAuthHeader() }
                });

                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                const folders = data.filter(item => item.type === 'dir');

                for (const folder of folders) {
                    const resSub = await fetch(folder.url, {
                        headers: { 'Authorization': getAuthHeader() }
                    });
                    if (resSub.ok) {
                        const files = await resSub.json();
                        hangarData[folder.name] = files.filter(f => {
                            const name = f.name.toLowerCase();
                            return name.endsWith('.pdf') || name.endsWith('.png') || name.endsWith('.jpg') || name.endsWith('.jpeg');
                        });
                    }
                }

                renderDashboard(hangarData);

            } catch (err) {
                console.error(err);
                dashboardGrid.innerHTML = `
                    <div class="placeholder-hud" style="grid-column: 1/-1; justify-self: center; align-self: center; border-color: #ef4444;">
                        <div class="placeholder-icon">⚠️</div>
                        <div class="placeholder-title" style="color: #ef4444;">Error de Conexión</div>
                        <div class="placeholder-subtitle">No se pudo acceder al repositorio. Verifica tu token o la conexión. (${err.message})</div>
                    </div>`;
            }
        }

        function renderDashboard(data) {
            dashboardGrid.innerHTML = '';

            Object.entries(data).forEach(([folderName, files]) => {
                const card = document.createElement('div');
                card.className = 'cyber-card';

                card.innerHTML = `
                    <div>
                        <div class="card-header">
                            <span class="card-icon">📁</span>
                            <span class="card-badge">${files.length} ITEMS</span>
                        </div>
                        <div class="card-title">${folderName}</div>
                    </div>
                    <div class="card-footer">
                        <span>Estado: Listo</span>
                        <span class="card-action">Explorar →</span>
                    </div>
                `;

                card.addEventListener('click', () => openFolder(folderName));
                dashboardGrid.appendChild(card);
            });
        }

        function openFolder(folderName) {
            activeZone = folderName;
            
            // Transición de pantallas
            dashboardGrid.classList.add('hidden');
            workspace.classList.add('active');

            // Actualizar Breadcrumb
            crumbSep.style.display = 'inline';
            crumbFolder.style.display = 'inline';
            crumbFolder.textContent = folderName;
            crumbFolder.className = 'active';

            currentFolderTitle.textContent = folderName;
            renderFileList(hangarData[folderName] || []);
        }

        function closeWorkspace() {
            activeZone = null;

            workspace.classList.remove('active');
            dashboardGrid.classList.remove('hidden');

            // Reset visores
            pdfViewer.style.display = 'none';
            imgViewer.style.display = 'none';
            hudWelcome.style.display = 'block';

            // Reset Breadcrumb
            crumbSep.style.display = 'none';
            crumbFolder.style.display = 'none';
            crumbFileSep.style.display = 'none';
            crumbFile.style.display = 'none';

            globalSearch.value = '';
            renderDashboard(hangarData);
        }

        function renderFileList(files) {
            fileList.innerHTML = '';

            if (files.length === 0) {
                fileList.innerHTML = '<li class="file-item" style="color: var(--text-muted);">Sin archivos compatibles</li>';
                return;
            }

            files.forEach(file => {
                const li = document.createElement('li');
                li.className = 'file-item';

                const isImg = file.name.toLowerCase().match(/\.(png|jpg|jpeg)$/);
                const icon = isImg ? '🖼️' : '📄';

                li.innerHTML = `<span>${icon}</span> <span>${file.name.replace(/\.[^/.]+$/, "")}</span>`;

                li.addEventListener('click', () => loadFile(file, li, isImg));
                fileList.appendChild(li);
            });
        }

        async function loadFile(file, element, isImg) {
            document.querySelectorAll('.file-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');

            // Actualizar Breadcrumb de archivo
            crumbFileSep.style.display = 'inline';
            crumbFile.style.display = 'inline';
            crumbFile.textContent = file.name;
            crumbFolder.className = '';

            hudWelcome.style.display = 'block';
            hudWelcome.querySelector('.placeholder-title').textContent = 'CARGANDO DATOS...';
            hudWelcome.querySelector('.placeholder-subtitle').textContent = 'Descargando blob firmado desde la red...';
            
            pdfViewer.style.display = 'none';
            imgViewer.style.display = 'none';

            try {
                const res = await fetch(`https://api.github.com/repos/${USERNAME}/${REPO}/git/blobs/${file.sha}`, {
                    headers: { 'Authorization': getAuthHeader() }
                });

                if (!res.ok) throw new Error(`HTTP ${res.status}`);

                const blobData = await res.json();
                const cleanBase64 = blobData.content.replace(/\s/g, '');

                hudWelcome.style.display = 'none';

                if (isImg) {
                    const ext = file.name.toLowerCase();
                    let mime = ext.endsWith('.png') ? 'image/png' : 'image/jpeg';
                    imgViewer.src = `data:${mime};base64,${cleanBase64}`;
                    imgViewer.style.display = 'block';
                } else {
                    pdfViewer.src = `data:application/pdf;base64,${cleanBase64}`;
                    pdfViewer.style.display = 'block';
                }

            } catch (err) {
                console.error(err);
                hudWelcome.style.display = 'block';
                hudWelcome.querySelector('.placeholder-title').textContent = 'ERROR DE CARGA';
                hudWelcome.querySelector('.placeholder-subtitle').textContent = err.message;
            }
        }

        // --- BUSCADOR ---
        globalSearch.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();

            if (workspace.classList.contains('active') && activeZone) {
                const filtered = (hangarData[activeZone] || []).filter(f => f.name.toLowerCase().includes(query));
                renderFileList(filtered);
            } else {
                if (!query) {
                    renderDashboard(hangarData);
                    return;
                }
                const filteredHangar = {};
                Object.entries(hangarData).forEach(([folder, files]) => {
                    const matchedFiles = files.filter(f => f.name.toLowerCase().includes(query));
                    if (matchedFiles.length > 0) filteredHangar[folder] = matchedFiles;
                });
                renderDashboard(filteredHangar);
            }
        });

        btnBack.addEventListener('click', closeWorkspace);
        init();
    </script>
</body>
</html>
